
name: Fetch Triplet index.html

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download index.html
        run: |
          curl -fLsS \
            --retry 3 \
            "https://triplet.mantaaway.com/" \
            -o index.html

          if ! grep -qi "<html" index.html; then
            echo "Downloaded file does not appear to be HTML."
            exit 1
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes to index.html."
          else
            git commit -m "Update Triplet index.html"
            git push
          fi
