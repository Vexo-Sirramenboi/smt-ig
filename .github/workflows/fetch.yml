
name: Fetch Triplet index.html

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and fix index.html
        run: |
          set -e

          curl -fLsS --retry 3 \
            "https://triplet.mantaaway.com/" \
            -o index.html

          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          replacements = {
              'src="/assets/':
                  'src="https://triplet.mantaaway.com/assets/',
              "src='/assets/":
                  "src='https://triplet.mantaaway.com/assets/",
              'href="/assets/':
                  'href="https://triplet.mantaaway.com/assets/',
              "href='/assets/":
                  "href='https://triplet.mantaaway.com/assets/",
              'href="/edu.svg"':
                  'href="https://triplet.mantaaway.com/edu.svg"',
              'href="/site.webmanifest"':
                  'href="https://triplet.mantaaway.com/site.webmanifest"',
          }

          for old, new in replacements.items():
              html = html.replace(old, new)

          if "<html" not in html.lower():
              raise SystemExit("Error: Downloaded file is not HTML.")

          path.write_text(html, encoding="utf-8")
          print("Successfully downloaded and updated index.html.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes to index.html."
          else
            git commit -m "Update Triplet index.html"
            git push
          fi
